# =====================================================================
# PetHealthEcosystem API (.NET 10 + Azure SQL) - Pipeline CI/CD no Azure DevOps
#
#  Stage 1 - CI : restore, build, TESTES AUTOMÁTICOS (unitários + integração,
#                 publicados na aba Tests), publish e publicação do artefato (.zip)
#  Stage 2 - CD : disparado após o novo artefato do CI; faz o deploy no
#                 Azure Web App (criado previamente pelos scripts da pasta infra/)
#
# Disparo automático a cada commit/merge na branch master.
#
# VARIÁVEIS (Pipelines > Edit > Variables) - marcar o cadeado nas SECRETAS:
#   NOME_WEBAPP                 pethealth-api-564578
#   ASPNETCORE_ENVIRONMENT      Production
#   SQL_CONNECTION    (secret)  Server=tcp:<servidor>.database.windows.net,1433;Initial Catalog=PetHealthDb;User ID=...;Password=...;Encrypt=True;
#   JWT_SECRET        (secret)  chave com no mínimo 32 caracteres
# =====================================================================

trigger:
  branches:
    include:
      - master

variables:
  buildConfiguration: 'Release'
  azureSubscription: 'MyAzureSubscription'      # nome da Service Connection (Azure Resource Manager)
  apiProject: 'src/PetHealthEcosystem.Api/PetHealthEcosystem.Api.csproj'
  testProjects: 'tests/**/*.csproj'
  artifactName: 'app'

stages:

# =========================================================
# 1. CI - BUILD E TESTES
# =========================================================
- stage: CI
  displayName: 'CI - Build e Testes'
  jobs:
    - job: BuildTest
      displayName: 'Build and Test'
      pool:
        vmImage: 'ubuntu-latest'

      steps:
        - checkout: self

        - task: UseDotNet@2
          displayName: 'Instalar .NET SDK 10'
          inputs:
            packageType: 'sdk'
            version: '10.0.x'

        - task: DotNetCoreCLI@2
          displayName: 'Restaurar dependências'
          inputs:
            command: 'restore'
            projects: |
              $(apiProject)
              $(testProjects)

        - task: DotNetCoreCLI@2
          displayName: 'Build da API'
          inputs:
            command: 'build'
            projects: '$(apiProject)'
            arguments: '--configuration $(buildConfiguration) --no-restore'

        # Testes automáticos (xUnit): o resultado é publicado na aba "Tests" da execução
        - task: DotNetCoreCLI@2
          displayName: 'Testes Automáticos (Unitários + Integração do CRUD de Pets)'
          inputs:
            command: 'test'
            projects: '$(testProjects)'
            arguments: '--configuration $(buildConfiguration) --no-restore'
            publishTestResults: true
            testRunTitle: 'Testes PetHealthEcosystem'

        - task: DotNetCoreCLI@2
          displayName: 'Publicar API'
          inputs:
            command: 'publish'
            publishWebProjects: false
            projects: '$(apiProject)'
            arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/publish'
            zipAfterPublish: false
            modifyOutputPath: false

        - task: ArchiveFiles@2
          displayName: 'Compactar aplicação'
          inputs:
            rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/publish'
            includeRootFolder: false
            archiveType: 'zip'
            archiveFile: '$(Build.ArtifactStagingDirectory)/$(artifactName).zip'
            replaceExistingArchive: true

        - task: PublishPipelineArtifact@1
          displayName: 'Publicar artefato'
          inputs:
            targetPath: '$(Build.ArtifactStagingDirectory)/$(artifactName).zip'
            artifact: '$(artifactName)'
            publishLocation: 'pipeline'

# =========================================================
# 2. CD - DEPLOY NO AZURE WEB APP (após novo artefato do CI)
# =========================================================
- stage: CD
  displayName: 'CD - Deploy no Azure Web App'
  dependsOn: CI
  condition: succeeded()

  jobs:
    - job: DeployWebApp
      displayName: 'Deploy da API'
      pool:
        vmImage: 'ubuntu-latest'

      steps:
        - checkout: none

        - task: DownloadPipelineArtifact@2
          displayName: 'Baixar artefato do CI'
          inputs:
            buildType: 'current'
            artifactName: '$(artifactName)'
            targetPath: '$(Pipeline.Workspace)/$(artifactName)'

        # Variáveis de ambiente da aplicação (segredos vêm das variáveis secretas da Pipeline)
        - task: AzureAppServiceSettings@1
          displayName: 'Configurar variáveis de ambiente do Web App'
          inputs:
            azureSubscription: '$(azureSubscription)'
            appName: '$(NOME_WEBAPP)'
            appSettings: |
              [
                {
                  "name": "ASPNETCORE_ENVIRONMENT",
                  "value": "$(ASPNETCORE_ENVIRONMENT)",
                  "slotSetting": false
                },
                {
                  "name": "ConnectionStrings__DefaultConnection",
                  "value": "$(SQL_CONNECTION)",
                  "slotSetting": false
                },
                {
                  "name": "Jwt__SecretKey",
                  "value": "$(JWT_SECRET)",
                  "slotSetting": false
                }
              ]

        - task: AzureWebApp@1
          displayName: 'Deploy da API no Azure Web App'
          inputs:
            azureSubscription: '$(azureSubscription)'
            appType: 'webAppLinux'
            appName: '$(NOME_WEBAPP)'
            package: '$(Pipeline.Workspace)/$(artifactName)/$(artifactName).zip'
            deploymentMethod: 'zipDeploy'
