<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0078d4"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#107c10"/>
    </marker>
    <symbol id="person" viewBox="0 0 40 50">
      <circle cx="20" cy="12" r="10"/>
      <path d="M2,50 C2,30 38,30 38,50 z"/>
    </symbol>
  </defs>

  <rect width="1400" height="820" fill="#ffffff"/>

  <!-- Título -->
  <text x="40" y="44" font-size="26" font-weight="700" fill="#111827">PetHealthEcosystem API — Arquitetura + Fluxo CI/CD (Sprint 4)</text>
  <text x="40" y="70" font-size="15" fill="#4b5563">.NET 10 (ASP.NET Core + EF Core) · Azure DevOps (Repos + Pipelines YAML) · Azure Web App Linux · Azure SQL Database (PaaS)</text>

  <!-- ============ ZONA: ESTAÇÃO DO DESENVOLVEDOR ============ -->
  <rect x="30" y="100" width="230" height="330" rx="14" fill="#f3f4f6" stroke="#9ca3af" stroke-dasharray="6 4"/>
  <text x="145" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#374151">Estação local</text>

  <use href="#person" x="120" y="140" width="50" height="62" fill="#6b21a8"/>
  <text x="145" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Desenvolvedor</text>
  <text x="145" y="240" text-anchor="middle" font-size="12" fill="#4b5563">(integrantes do grupo)</text>

  <rect x="55" y="262" width="180" height="70" rx="10" fill="#ffffff" stroke="#6b21a8" stroke-width="2"/>
  <text x="145" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">IDE (VS Code)</text>
  <text x="145" y="310" text-anchor="middle" font-size="12" fill="#4b5563">código C# .NET 10 + testes</text>

  <rect x="55" y="346" width="180" height="62" rx="10" fill="#ffffff" stroke="#f05033" stroke-width="2"/>
  <text x="145" y="372" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Git</text>
  <text x="145" y="392" text-anchor="middle" font-size="12" fill="#4b5563">commit / push na master</text>

  <!-- ============ ZONA: AZURE DEVOPS ============ -->
  <rect x="300" y="100" width="640" height="420" rx="14" fill="#eff6fc" stroke="#0078d4" stroke-width="2"/>
  <text x="320" y="128" font-size="17" font-weight="700" fill="#0078d4">Azure DevOps — projeto "Sprint 4 – Azure DevOps" (Private · Git · Scrum)</text>

  <!-- Repos -->
  <rect x="325" y="150" width="190" height="110" rx="12" fill="#ffffff" stroke="#0078d4" stroke-width="2"/>
  <text x="420" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Azure Repos</text>
  <text x="420" y="202" text-anchor="middle" font-size="12" fill="#4b5563">repositório Git</text>
  <text x="420" y="220" text-anchor="middle" font-size="12" fill="#4b5563">branch master</text>
  <text x="420" y="238" text-anchor="middle" font-size="12" fill="#4b5563">azure-pipelines.yml</text>

  <!-- Pipeline CI -->
  <rect x="560" y="150" width="355" height="190" rx="12" fill="#ffffff" stroke="#0078d4" stroke-width="2"/>
  <text x="737" y="176" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Azure Pipelines — Stage CI (ubuntu-latest)</text>
  <g font-size="13" fill="#1f2937">
    <text x="580" y="204">③ UseDotNet 10 + dotnet restore</text>
    <text x="580" y="228">④ dotnet build (Release)</text>
    <text x="580" y="252">⑤ dotnet test — 39 testes xUnit</text>
    <text x="604" y="270" font-size="11" fill="#4b5563">unitários + integração → aba Tests</text>
    <text x="580" y="294">⑥ dotnet publish + zip</text>
    <text x="580" y="318">⑦ PublishPipelineArtifact "app"</text>
  </g>

  <!-- Artefato -->
  <rect x="325" y="300" width="190" height="80" rx="12" fill="#fff7e6" stroke="#d97706" stroke-width="2"/>
  <text x="420" y="330" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Artefato app.zip</text>
  <text x="420" y="352" text-anchor="middle" font-size="12" fill="#4b5563">Pipeline Artifacts</text>

  <!-- Pipeline CD -->
  <rect x="560" y="360" width="355" height="140" rx="12" fill="#ffffff" stroke="#107c10" stroke-width="2"/>
  <text x="737" y="386" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Azure Pipelines — Stage CD</text>
  <g font-size="13" fill="#1f2937">
    <text x="580" y="414">⑧ DownloadPipelineArtifact (app.zip)</text>
    <text x="580" y="438">⑨ AzureAppServiceSettings (variáveis 🔒)</text>
    <text x="580" y="462">⑩ AzureWebApp zipDeploy</text>
    <text x="580" y="486" font-size="11" fill="#4b5563">Service Connection: MyAzureSubscription</text>
  </g>

  <!-- Variáveis secretas -->
  <rect x="325" y="400" width="190" height="100" rx="12" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="420" y="428" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Variáveis secretas 🔒</text>
  <text x="420" y="450" text-anchor="middle" font-size="12" fill="#4b5563">SQL_CONNECTION</text>
  <text x="420" y="468" text-anchor="middle" font-size="12" fill="#4b5563">JWT_SECRET</text>
  <text x="420" y="486" text-anchor="middle" font-size="12" fill="#4b5563">NOME_WEBAPP</text>

  <!-- ============ ZONA: AZURE ============ -->
  <rect x="980" y="100" width="390" height="560" rx="14" fill="#f0fdf4" stroke="#107c10" stroke-width="2"/>
  <text x="1000" y="128" font-size="17" font-weight="700" fill="#107c10">Microsoft Azure — rg-pethealth-564578</text>

  <rect x="1005" y="150" width="340" height="190" rx="12" fill="#ffffff" stroke="#107c10" stroke-width="2"/>
  <text x="1175" y="178" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">App Service Plan (Linux B1)</text>
  <rect x="1030" y="194" width="290" height="128" rx="10" fill="#e6f4ea" stroke="#107c10"/>
  <text x="1175" y="220" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Azure Web App</text>
  <text x="1175" y="240" text-anchor="middle" font-size="12" fill="#4b5563">pethealth-api-564578.azurewebsites.net</text>
  <text x="1175" y="262" text-anchor="middle" font-size="12" fill="#4b5563">ASP.NET Core .NET 10 · Swagger · JWT</text>
  <text x="1175" y="282" text-anchor="middle" font-size="12" fill="#4b5563">EF Core (migração automática)</text>
  <text x="1175" y="302" text-anchor="middle" font-size="12" fill="#4b5563">App Settings: ConnectionStrings / Jwt</text>

  <rect x="1005" y="430" width="340" height="140" rx="12" fill="#ffffff" stroke="#0078d4" stroke-width="2"/>
  <ellipse cx="1080" cy="470" rx="34" ry="11" fill="#cfe6fa" stroke="#0078d4"/>
  <path d="M1046,470 v50 a34,11 0 0 0 68,0 v-50" fill="#cfe6fa" stroke="#0078d4"/>
  <text x="1230" y="466" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Azure SQL Database</text>
  <text x="1230" y="486" text-anchor="middle" font-size="12" fill="#4b5563">PaaS · sql-pethealth-db-564578</text>
  <text x="1230" y="506" text-anchor="middle" font-size="12" fill="#4b5563">banco PetHealthDb</text>
  <text x="1230" y="526" text-anchor="middle" font-size="12" fill="#4b5563">tabela PETS</text>
  <text x="1175" y="556" text-anchor="middle" font-size="11" fill="#4b5563">firewall: serviços Azure + IP do desenvolvedor</text>

  <rect x="1005" y="590" width="340" height="50" rx="10" fill="#ffffff" stroke="#9ca3af"/>
  <text x="1175" y="620" text-anchor="middle" font-size="13" fill="#374151">Infra criada via Azure CLI (pasta infra/)</text>

  <!-- ============ PERSONAS EXTERNAS ============ -->
  <use href="#person" x="1150" y="690" width="50" height="62" fill="#0f766e"/>
  <text x="1175" y="772" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Usuário final</text>
  <text x="1175" y="790" text-anchor="middle" font-size="12" fill="#4b5563">clínica / tutor (Swagger, REST)</text>

  <use href="#person" x="580" y="600" width="50" height="62" fill="#b45309"/>
  <text x="605" y="682" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Professor</text>
  <text x="605" y="700" text-anchor="middle" font-size="12" fill="#4b5563">acesso Basic (avaliação)</text>

  <use href="#person" x="300" y="600" width="50" height="62" fill="#6b21a8"/>
  <text x="325" y="682" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Desenvolvedor</text>
  <text x="325" y="700" text-anchor="middle" font-size="12" fill="#4b5563">SELECT de evidência</text>

  <!-- ============ SETAS ============ -->
  <!-- 1: IDE -> Git -->
  <line x1="145" y1="332" x2="145" y2="344" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 2: Git push -> Repos -->
  <path d="M235,377 C280,377 280,205 323,205" fill="none" stroke="#0078d4" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <circle cx="272" cy="300" r="13" fill="#0078d4"/><text x="272" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text>
  <text x="272" y="332" font-size="11" fill="#0078d4" text-anchor="middle">git push</text>

  <!-- trigger master -> CI -->
  <line x1="515" y1="205" x2="558" y2="205" stroke="#0078d4" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <circle cx="537" cy="185" r="13" fill="#0078d4"/><text x="537" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text>
  <text x="537" y="232" font-size="10" fill="#0078d4" text-anchor="middle">trigger</text>
  <text x="537" y="244" font-size="10" fill="#0078d4" text-anchor="middle">master</text>

  <!-- CI -> Artifact -->
  <path d="M560,318 L517,330" fill="none" stroke="#d97706" stroke-width="3" marker-end="url(#arrow)"/>
  <!-- Artifact -> CD -->
  <path d="M480,382 C500,420 520,430 558,430" fill="none" stroke="#107c10" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="537" y="394" font-size="10" fill="#107c10" text-anchor="middle">novo artefato</text>
  <!-- Secrets -> CD -->
  <line x1="515" y1="465" x2="558" y2="465" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>

  <!-- CD -> Web App -->
  <path d="M915,440 C960,440 960,260 1028,260" fill="none" stroke="#107c10" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <circle cx="955" cy="350" r="15" fill="#107c10"/><text x="955" y="355" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">11</text>
  <text x="962" y="390" font-size="11" fill="#107c10">deploy</text>

  <!-- Web App <-> SQL -->
  <line x1="1175" y1="324" x2="1175" y2="428" stroke="#0078d4" stroke-width="3" marker-start="url(#arrowBlue)" marker-end="url(#arrowBlue)"/>
  <circle cx="1200" cy="378" r="15" fill="#0078d4"/><text x="1200" y="383" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">13</text>
  <text x="1150" y="374" font-size="11" fill="#0078d4" text-anchor="end">EF Core / TDS 1433</text>
  <text x="1150" y="390" font-size="11" fill="#0078d4" text-anchor="end">INSERT·SELECT·UPDATE·DELETE</text>

  <!-- Usuário final -> Web App -->
  <path d="M1200,720 C1388,720 1388,280 1322,280" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
  <circle cx="1372" cy="480" r="15" fill="#0f766e"/><text x="1372" y="485" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">12</text>
  <text x="1240" y="700" font-size="11" fill="#0f766e">HTTPS CRUD /api/Pets</text>

  <!-- Professor -> Azure DevOps -->
  <line x1="605" y1="598" x2="605" y2="524" stroke="#b45309" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>

  <!-- Dev SELECT -> SQL -->
  <path d="M350,640 C700,780 900,760 1003,540" fill="none" stroke="#6b21a8" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <circle cx="700" cy="745" r="15" fill="#6b21a8"/><text x="700" y="750" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">14</text>
  <text x="730" y="790" font-size="11" fill="#6b21a8">SELECT * FROM PETS (Editor de consultas / sqlcmd)</text>

  <!-- Legenda -->
  <g font-size="12" fill="#374151">
    <text x="40" y="560" font-weight="700">Ordem do fluxo</text>
    <text x="40" y="580">1 push · 2 trigger master</text>
    <text x="40" y="598">3–7 CI: build, testes, artefato</text>
    <text x="40" y="616">8–11 CD: download, settings, deploy</text>
    <text x="40" y="634">12 usuário acessa a API</text>
    <text x="40" y="652">13 API persiste no Azure SQL</text>
    <text x="40" y="670">14 evidência via SELECT</text>
  </g>
</svg>
